# Render static site routing configuration
# Generated: 2026-05-19T14:33:32.854Z
# More specific routes should be listed before catch-all routes

routes:
  - type: rewrite
    source: /product/*
    destination: /product.html
  - type: rewrite
    source: /category/*
    destination: /category.html
  - type: rewrite
    source: /en/product/*
    destination: /product.html
  - type: rewrite
    source: /en/category/*
    destination: /category.html
